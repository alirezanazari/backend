spring:
  application:
    name: card-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${CARD_DB_HOST:localhost}:${CARD_DB_PORT:5432}/${CARD_DB_NAME:card_db}
    username: ${CARD_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${CARD_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    jwt-secret: ${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}}
  internal:
    service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  card:
    order-enabled: ${REDBANK_CARD_ORDER_ENABLED:true}
    expiry-years: ${REDBANK_CARD_EXPIRY_YEARS:5}
    bin: ${REDBANK_CARD_BIN:621986}
  account-client:
    enabled: ${REDBANK_CARD_ACCOUNT_CLIENT_ENABLED:true}
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  feature-flag-client:
    enabled: ${REDBANK_CARD_FEATURE_FLAG_CLIENT_ENABLED:false}
    base-url: ${FEATURE_FLAG_SERVICE_URL:http://localhost:8086}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
