spring:
  application:
    name: feature-flag-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${FEATURE_FLAG_DB_HOST:localhost}:${FEATURE_FLAG_DB_PORT:5432}/${FEATURE_FLAG_DB_NAME:feature_flag_db}
    username: ${FEATURE_FLAG_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${FEATURE_FLAG_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-},%X{traceId:-},%X{spanId:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    jwt-secret: ${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:}
    verification-public-key: ${REDBANK_JWT_PUBLIC_KEY:}
  internal:
    service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  account-context-client:
    enabled: ${REDBANK_FEATURE_FLAG_ACCOUNT_CONTEXT_CLIENT_ENABLED:true}
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
    feature-evaluation-context-get-token: ${REDBANK_ACCOUNT_FEATURE_EVALUATION_CONTEXT_GET_TOKEN_SECRET:local-develop-internal-service-token-change-me}
