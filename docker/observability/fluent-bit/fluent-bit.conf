[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.stdout
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /tmp/fluent-bit-redbank-containers.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[INPUT]
    Name              tail
    Tag               redbank.local
    Path              /redbank/logs/develop/*.log
    DB                /tmp/fluent-bit-redbank-local-files.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_From_Head    Off

[FILTER]
    Name  grep
    Match docker.stdout
    Regex log ^\{.*("service\.name":"(api-gateway|iam-service|account-service|ledger-service|card-service|kyc-service|feature-flag-service|transfer-service|pfm-service)"|"service":\{[^}]*"name":"(api-gateway|iam-service|account-service|ledger-service|card-service|kyc-service|feature-flag-service|transfer-service|pfm-service)").*\}$

[FILTER]
    Name  grep
    Match redbank.local
    Regex log ^\{.*("service\.name":"(api-gateway|iam-service|account-service|ledger-service|card-service|kyc-service|feature-flag-service|transfer-service|pfm-service)"|"service":\{[^}]*"name":"(api-gateway|iam-service|account-service|ledger-service|card-service|kyc-service|feature-flag-service|transfer-service|pfm-service)").*\}$

[OUTPUT]
    Name         http
    Match        docker.stdout
    Host         data-prepper
    Port         2021
    URI          /logs/ingest
    Format       json
    Json_Date_Key false
    Header       Content-Type application/json
    Retry_Limit  False

[OUTPUT]
    Name         http
    Match        redbank.local
    Host         data-prepper
    Port         2021
    URI          /logs/ingest
    Format       json
    Json_Date_Key false
    Header       Content-Type application/json
    Retry_Limit  False
