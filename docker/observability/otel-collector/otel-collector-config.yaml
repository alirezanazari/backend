extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/sanitize:
    actions:
      - key: baggage
        action: delete
      - key: user.id
        action: delete
      - key: profile.id
        action: delete
      - key: device.id
        action: delete
      - key: account.number
        action: delete
      - key: card.number
        action: delete
      - key: national.id
        action: delete
      - key: phone.number
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
  resource/redbank:
    attributes:
      - key: service.namespace
        value: redbank
        action: upsert
      - key: deployment.environment
        value: ${env:REDBANK_OBSERVABILITY_ENVIRONMENT}
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/data-prepper-traces:
    endpoint: data-prepper:21890
    tls:
      insecure: true
  otlp/data-prepper-metrics:
    endpoint: data-prepper:21891
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/sanitize
        - resource/redbank
        - batch
      exporters:
        - otlp/data-prepper-traces
        - debug
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/sanitize
        - resource/redbank
        - batch
      exporters:
        - otlp/data-prepper-metrics
        - debug
