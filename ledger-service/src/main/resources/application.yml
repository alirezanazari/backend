spring:
  application:
    name: ledger-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${LEDGER_DB_HOST:localhost}:${LEDGER_DB_PORT:5432}/${LEDGER_DB_NAME:ledger_db}
    username: ${LEDGER_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${LEDGER_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  events:
    publisher:
      enabled: ${REDBANK_LOCAL_EVENT_PUBLISHER_ENABLED:true}
      delay-ms: ${REDBANK_LOCAL_EVENT_PUBLISHER_DELAY_MS:5000}
  internal:
    service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
