spring:
  application:
    name: iam-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${IAM_DB_HOST:localhost}:${IAM_DB_PORT:5432}/${IAM_DB_NAME:iam_db}
    username: ${IAM_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${IAM_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-},%X{traceId:-},%X{spanId:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  events:
    publisher:
      enabled: ${REDBANK_LOCAL_EVENT_PUBLISHER_ENABLED:true}
      delay-ms: ${REDBANK_LOCAL_EVENT_PUBLISHER_DELAY_MS:5000}
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    mock-otp:
      enabled: ${REDBANK_DEBUG_MOCK_OTP_ENABLED:false}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    access-token-ttl-seconds: ${REDBANK_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    onboarding-token-ttl-seconds: ${REDBANK_JWT_ONBOARDING_TOKEN_TTL_SECONDS:300}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}}
    signing-private-key: ${REDBANK_JWT_PRIVATE_KEY:}
    verification-public-key: ${REDBANK_JWT_PUBLIC_KEY:}
  account-client:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    internal-service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  otp:
    ttl-seconds: ${REDBANK_OTP_TTL_SECONDS:300}
    max-attempts: ${REDBANK_OTP_MAX_ATTEMPTS:5}
