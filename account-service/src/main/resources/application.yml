spring:
  application:
    name: account-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${ACCOUNT_DB_HOST:localhost}:${ACCOUNT_DB_PORT:5432}/${ACCOUNT_DB_NAME:account_db}
    username: ${ACCOUNT_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${ACCOUNT_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-},%X{traceId:-},%X{spanId:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    jwt-secret: ${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:}
    verification-public-key: ${REDBANK_JWT_PUBLIC_KEY:}
  account:
    iban-country-code: ${REDBANK_ACCOUNT_IBAN_COUNTRY_CODE:IR}
    bank-code: ${REDBANK_ACCOUNT_BANK_CODE:0620}
    default-currency: ${REDBANK_ACCOUNT_DEFAULT_CURRENCY:IRR}
    max-profiles-per-user: ${REDBANK_ACCOUNT_MAX_PROFILES_PER_USER:5}
    allowed-job-ids: ${REDBANK_ACCOUNT_ALLOWED_JOB_IDS:job-engineer,job-student,job-business-owner,job-other}
  internal:
    service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
    vault-create-token-secret: ${REDBANK_ACCOUNT_VAULT_CREATE_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
    completion-get-token-secret: ${REDBANK_ACCOUNT_COMPLETION_GET_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
    card-eligibility-get-token-secret: ${REDBANK_ACCOUNT_CARD_ELIGIBILITY_GET_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
    referral-reward-account-get-token-secret: ${REDBANK_ACCOUNT_REFERRAL_REWARD_ACCOUNT_GET_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
    feature-evaluation-context-get-token-secret: ${REDBANK_ACCOUNT_FEATURE_EVALUATION_CONTEXT_GET_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
    transfer-resolve-token-secret: ${REDBANK_ACCOUNT_TRANSFER_RESOLVE_TOKEN_SECRET:${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}}
  ledger:
    enabled: ${REDBANK_LEDGER_CLIENT_ENABLED:false}
    base-url: ${REDBANK_LEDGER_BASE_URL:http://localhost:8083}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  card:
    enabled: ${REDBANK_CARD_CLIENT_ENABLED:false}
    base-url: ${REDBANK_CARD_BASE_URL:http://localhost:8084}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
