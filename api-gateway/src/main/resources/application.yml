spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/iam/**
                - Method=POST
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/account/**,/api/v1/profile/**
                - Method=POST
            - id: card-service
              uri: ${CARD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/card/**
                - Method=POST
            - id: kyc-service
              uri: ${KYC_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/kyc/**
                - Method=POST
            - id: feature-flag-service
              uri: ${FEATURE_FLAG_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/feature-flags/**
                - Method=POST
            - id: transfer-service
              uri: ${TRANSFER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/transfers/**
                - Method=POST
            - id: pfm-service
              uri: ${PFM_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/pfm/**
                - Method=POST

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    jwt-secret: ${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}
    mock-otp:
      enabled: ${REDBANK_DEBUG_MOCK_OTP_ENABLED:false}
  gateway:
    app-encryption:
      enabled: ${REDBANK_GATEWAY_APP_ENCRYPTION_ENABLED:false}
      key-exchange-ttl-seconds: ${REDBANK_GATEWAY_KEY_EXCHANGE_TTL_SECONDS:300}
      max-encrypted-body-bytes: ${REDBANK_GATEWAY_MAX_ENCRYPTED_BODY_BYTES:1048576}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    access-token-ttl-seconds: ${REDBANK_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}}
