spring:
  application:
    name: kyc-service
    version: ${REDBANK_SERVICE_VERSION:0.1.0-SNAPSHOT}
  datasource:
    url: jdbc:postgresql://${KYC_DB_HOST:localhost}:${KYC_DB_PORT:5432}/${KYC_DB_NAME:kyc_db}
    username: ${KYC_DB_USERNAME:${POSTGRES_USER:redbank}}
    password: ${KYC_DB_PASSWORD:${POSTGRES_PASSWORD:redbank_develop_password}}
  flyway:
    enabled: ${REDBANK_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${REDBANK_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation.id:-}]"
  structured:
    ecs:
      service:
        environment: ${REDBANK_OBSERVABILITY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
        node-name: ${REDBANK_SERVICE_NODE_NAME:${HOSTNAME:local}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

redbank:
  debug:
    enabled: ${REDBANK_DEBUG_ENABLED:false}
    jwt-secret: ${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}
  jwt:
    issuer: ${REDBANK_JWT_ISSUER:red-bank-develop}
    audience: ${REDBANK_JWT_AUDIENCE:red-bank-api}
    signing-secret: ${REDBANK_JWT_SIGNING_SECRET:${REDBANK_DEBUG_JWT_SECRET:local-develop-debug-secret-change-me-32bytes}}
  internal:
    service-token-secret: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  kyc:
    referral-reward-amount: ${REDBANK_KYC_REFERRAL_REWARD_AMOUNT:500000}
    referral-reward-currency: ${REDBANK_KYC_REFERRAL_REWARD_CURRENCY:IRR}
    referral-reward-enabled: ${REDBANK_KYC_REFERRAL_REWARD_ENABLED:true}
  referrer-account-client:
    enabled: ${REDBANK_KYC_REFERRER_ACCOUNT_CLIENT_ENABLED:true}
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  referral-reward-client:
    enabled: ${REDBANK_KYC_REWARD_CLIENT_ENABLED:true}
    base-url: ${REDBANK_LEDGER_BASE_URL:http://localhost:8083}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
  feature-flag-client:
    enabled: ${REDBANK_KYC_FEATURE_FLAG_CLIENT_ENABLED:true}
    base-url: ${FEATURE_FLAG_SERVICE_URL:http://localhost:8086}
    service-token: ${REDBANK_INTERNAL_SERVICE_TOKEN_SECRET:local-develop-internal-service-token-change-me}
