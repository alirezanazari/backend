name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Maven Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - iam-service
          - account-service
          - ledger-service
          - card-service
          - kyc-service
          - feature-flag-service
          - transfer-service
          - pfm-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --file docker/app/Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} \
            --tag redbank/${{ matrix.service }}:${{ github.sha }} \
            .
